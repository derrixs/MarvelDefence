# Configurações do Gradle para todo o projeto.
# Para usuários de IDEs (como o Android Studio):
# As configurações do Gradle definidas na IDE têm prioridade
# sobre as configurações deste arquivo.
# Para mais detalhes sobre a configuração do ambiente de build, consulte
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Define os argumentos da JVM usados pelo processo daemon.
# Esta configuração é útil para ajustar o uso de memória.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Quando configurado, o Gradle executa o modo paralelo experimental.
# Esta opção deve ser usada apenas em projetos com módulos independentes. Consulte
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Quando ativado, o cache de configuração permite ao Gradle pular toda a etapa de
# configuração se nada que afete o build, como scripts de build, tiver mudado.
# O Gradle também aplica otimizações de desempenho à execução das tarefas.
org.gradle.configuration-cache=true
